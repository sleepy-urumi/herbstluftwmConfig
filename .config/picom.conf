##############################################
# Backend + General
##############################################

backend = "glx";
vsync = true;
use-damage = true;

##############################################
# Opacity (Frosted Glass)
##############################################

inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
  "90:class_g = 'Polybar'",
  "92:class_g = 'kitty'",
  "92:class_g = 'Alacritty'",
  "90:class_g = 'Rofi'",
  "85:class_g = 'Thunar'",
  "85:class_g = 'Nautilus'",
  "88:class_g = 'Firefox'",
];

##############################################
# Shadows
##############################################

shadow = true;
shadow-radius = 20;
shadow-opacity = 0.30;
shadow-offset-x = -12;
shadow-offset-y = -12;

shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "name = 'Notification'",
  "class_g = 'hlwm-frame'",   # HLWM frame borders
  "class_g = 'kitty' && focused",
];

##############################################
# Blur (Liquid Glass)
##############################################

blur-method = "gaussian";
blur-size = 22;             # stronger blur
blur-deviation = 12.0;      # smoother blur

blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;

##############################################
# Fading
##############################################

fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

fade-exclude = [
  "class_g = 'Polybar'",
];

##############################################
# Rounded Corners
##############################################

corner-radius = 14;

rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "class_g = 'hlwm-frame'",
];

##############################################
# Window Types
##############################################

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.9; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};

##############################################
# Misc
##############################################

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

unredir-if-possible = false;
